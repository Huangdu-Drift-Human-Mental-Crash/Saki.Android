name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'decoder-alac-java/**'
              - 'buildSrc/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/**'
              - 'scripts/ci/**'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.SAKI_RELEASE_KEYSTORE_BASE64 != '' && secrets.SAKI_RELEASE_STORE_PASSWORD != '' && secrets.SAKI_RELEASE_KEY_ALIAS != '' && secrets.SAKI_RELEASE_KEY_PASSWORD != '' }}
      SAKI_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      SAKI_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate CI scripts
        run: bash -n scripts/ci/*.sh

      - name: Test CI scripts
        run: |
          bash scripts/ci/test-stage-apk.sh
          bash scripts/ci/test-publish-telegram-apks.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Test versioning rules
        run: ./gradlew -p buildSrc test --no-daemon

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          SAKI_RELEASE_KEYSTORE_BASE64: ${{ secrets.SAKI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SAKI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/saki-release.jks"

      - name: Build release
        env:
          SAKI_RELEASE_STORE_FILE: ${{ runner.temp }}/saki-release.jks
          SAKI_RELEASE_STORE_PASSWORD: ${{ secrets.SAKI_RELEASE_STORE_PASSWORD }}
          SAKI_RELEASE_KEY_ALIAS: ${{ secrets.SAKI_RELEASE_KEY_ALIAS }}
          SAKI_RELEASE_KEY_PASSWORD: ${{ secrets.SAKI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Stage APK artifacts
        if: github.event_name == 'push'
        run: |
          bash scripts/ci/stage-apk.sh debug artifacts/debug
          bash scripts/ci/stage-apk.sh release artifacts/release

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: artifacts/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: artifacts/release/*.apk
          if-no-files-found: error
          retention-days: 30

  telegram:
    name: Publish Release and Debug APKs to Telegram
    needs: build
    if: >-
      github.event_name == 'push' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools build-tools;36.0.0

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: artifacts/release

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: app-debug
          path: artifacts/debug

      - name: Send Release and Debug APKs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash scripts/ci/publish-telegram-apks.sh artifacts/release artifacts/debug
